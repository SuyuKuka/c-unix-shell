 */

plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply a specific Java toolchain to ease working on different environments.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'random.analyzer.App'
    applicationDefaultJvmArgs = []
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}

// Tâche personnalisée pour logiciel 1
tasks.register('run1', JavaExec) {
    group = 'application'
    description = 'Run analyzer (Logiciel 1)'
    classpath = sourceSets.main.runtimeClasspath
    main = 'random.analyzer.App'
    workingDir = rootProject.projectDir

    // Force l'utilisation de la version de Java configurée dans `java.toolchain`
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

// Tâche personnalisée pour logiciel 2
tasks.register('run2', JavaExec) {
    group = 'application'
    description = 'Run evaluator (Logiciel 2)'
    classpath = sourceSets.main.runtimeClasspath
    main = 'random.evaluator.Main'
    workingDir = rootProject.projectDir

    // Force l'utilisation de la version de Java configurée dans `java.toolchain`
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    })
}

run {
    workingDir = rootProject.projectDir
}

sourceSets {
    main {
        resources {
            srcDir 'ressources'
        }
    }
}
